<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADALIN</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cormorant Garamond & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #f7f3eb 50%, #fefefe 100%);
            min-height: 100vh;
        }

        .font-serif-title {
            font-family: 'Cormorant Garamond', serif;
        }

        /* Gold accents */
        .gold-gradient-text {
            background: linear-gradient(135deg, #b8860b 0%, #d4af37 50%, #aa7c11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-border {
            border-color: rgba(212, 175, 55, 0.3);
        }

        /* Glassmorphism Card Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 20px 40px rgba(184, 134, 11, 0.08), 0 8px 16px rgba(0, 0, 0, 0.03);
        }

        /* Kaspi Crimson Button Styling */
        .btn-kaspi {
            background: linear-gradient(135deg, #f14635 0%, #e1251b 100%);
            box-shadow: 0 10px 20px rgba(225, 37, 27, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-kaspi:hover {
            background: linear-gradient(135deg, #ff5343 0%, #ed2d23 100%);
            box-shadow: 0 14px 28px rgba(225, 37, 27, 0.35);
            transform: translateY(-2px);
        }

        .btn-kaspi:active {
            transform: translateY(1px);
            box-shadow: 0 6px 12px rgba(225, 37, 27, 0.2);
        }

        /* White Elegance Button Styling */
        .btn-white {
            background: #ffffff;
            color: #2d3748;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-white:hover {
            border-color: rgba(212, 175, 55, 0.6);
            box-shadow: 0 12px 25px rgba(212, 175, 55, 0.15);
            transform: translateY(-2px);
            background: #fcfbf9;
        }

        .btn-white:active {
            transform: translateY(1px);
        }

        /* Subtle floating background lights */
        .ambient-glow-1 {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(243, 229, 192, 0.45) 0%, rgba(255,255,255,0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .ambient-glow-2 {
            position: absolute;
            bottom: 10%;
            right: 15%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(228, 206, 150, 0.3) 0%, rgba(255,255,255,0) 70%);
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-6 relative overflow-x-hidden">

                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <span class="text-xs sm:text-sm font-medium text-stone-600">Instagram:</span>

                   rel="noopener noreferrer"

                    adalin.kzz

            <!-- TikTok Link -->

                <div class="flex items-center gap-3">

                        <i class="fa-brands fa-tiktok"></i>

            </div>

            <!-- WhatsApp Number Link -->
            <div class="flex items-center justify-between p-3.5 rounded-xl bg-white/60 border border-stone-200/60 hover:border-amber-300 transition-colors">

                        <i class="fa-solid fa-phone"></i>
                    </div>

        </section>

        <!-- Footer -->
        <footer class="mt-8 pt-4 text-center">
            <p class="text-[11px] text-stone-400 tracking-wider font-light">
                &copy; ADALIN. Все права защищены.
            </p>
        </footer>

    </main>

</body>
</html>
